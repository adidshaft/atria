name: Static gate

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run test_handoff_static_checks.py
        run: python3 test_handoff_static_checks.py
